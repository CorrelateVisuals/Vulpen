# The keymap the keys part reads: a chord, = and the line it sends, as a line typed at the
# command port, so a key does nothing a typed command cannot. A chord holds shift,
# control, alt or super, joined by +, then presses a key named as the input command names
# it. Hold control for a letter: with no modifier, or another, the letter types as well.
# A key no chord takes goes to the node in focus. A key there is not, a chord given twice
# or a line no command takes stops the keys part, naming the line (A02).

control+l = clear
control+s = write
f1        = mode edit
f2        = mode perform
